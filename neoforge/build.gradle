plugins {
    id "me.modmuss50.mod-publish-plugin" version "2.1.1"
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')

    implementation('com.github.usefulness:webp-imageio:0.10.2') {
        exclude group: 'org.jetbrains.kotlin'
    }
    shadowBundle('com.github.usefulness:webp-imageio:0.10.2') {
        exclude group: 'org.jetbrains.kotlin'
    }

    implementation('com.vladsch.flexmark:flexmark-html2md-converter:0.64.8') {
        exclude group: 'org.jetbrains.kotlin'
    }
    shadowBundle('com.vladsch.flexmark:flexmark-html2md-converter:0.64.8') {
        exclude group: 'org.jetbrains.kotlin'
    }
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'

    exclude 'module-info.class'
    exclude '**/module-info.class'
    exclude 'kotlin/**'
    exclude 'META-INF/*.kotlin_module'
}
remapJar {
    inputFile.set shadowJar.archiveFile
}

publishMods {
    dryRun = gradle.startParameter.taskNames.any { it.contains("publishModsDry") }

    file = tasks.remapJar.archiveFile
    displayName = "CthuLib [NEOFORGE] [${rootProject.minecraft_version}] - [${project.version}]"
    type = STABLE
    modLoaders.add("neoforge")

    def changelogFile = rootProject.file("CHANGELOG.md")
    def changelogText = changelogFile.exists() ? changelogFile.text : ""
    changelog = changelogText.trim().isEmpty() ? "No changelog provided." : changelogText

    curseforge {
        projectId = "983401"
        projectSlug = "cthulib"
        accessToken = providers.gradleProperty("cfToken")
            .orElse(providers.environmentVariable("CF_TOKEN"))
        minecraftVersions.add("1.21.1")
        javaVersions.add(JavaVersion.VERSION_21)
        clientRequired = true
        serverRequired = false
    }

    modrinth {
        projectId = "iaxT78Vz"
        accessToken = providers.gradleProperty("modrinthToken")
            .orElse(providers.environmentVariable("MODRINTH_TOKEN"))
        minecraftVersions.add("1.21.1")
        environment = CLIENT_ONLY
    }
}

tasks.register("publishModsDry", Copy) {
    group = "upload"
    description = "Dry run of publishMods - writes to build/unified-dry/ instead of uploading."

    def publishTasks = tasks.withType(me.modmuss50.mpp.PublishModTask)
    dependsOn publishTasks

    from(publishTasks.collect { it.dryRunDirectory }) {
        include "**/*.jar"
    }
    into rootProject.layout.buildDirectory.dir("unified-dry")
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

tasks.named("publishMods") { group = "upload" }
tasks.withType(me.modmuss50.mpp.PublishModTask).configureEach {
    group = "upload"
}
